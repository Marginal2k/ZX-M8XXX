<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZX-M8XXX SAM Coupé</title>
    <!--
      The SAM Coupé: a machine of its own, on its own page (core/sam/,
      ui/sam-app.js). It shares the Z80 and the SAA1099 with the Spectrum.
    -->
    <style>
        html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
        body { display: flex; flex-direction: column; overflow: hidden; }
        #bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: #1b1b1b; border-bottom: 1px solid #333; flex-wrap: wrap; }
        #bar button, #bar label.btn { background: #2c2c2c; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
        #bar button:hover, #bar label.btn:hover { background: #3a3a3a; }
        #bar .title { font-weight: 600; margin-right: 8px; }
        #bar .status { color: #999; margin-left: auto; }
        #main { flex: 1 1 auto; min-height: 0; display: flex; }
        #screen { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; background: #000; }
        #debug { flex: 0 0 auto; width: 470px; border-left: 1px solid #333; }
        #debug.hidden { display: none; }
        #screen canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; outline: none; }
        #keys { padding: 4px 8px; color: #888; font-size: 12px; background: #1b1b1b; border-top: 1px solid #333; }
    </style>
</head>
<body>
    <div id="bar">
        <span class="title">SAM Coupé</span>
        <label class="btn" title="Open a disk (MGT, SAD, DSK, also .gz / .zip) into drive 1 and boot it">📂 Disk 1<input type="file" id="file1" hidden></label>
        <label class="btn" title="Open a disk into drive 2">📂 Disk 2<input type="file" id="file2" hidden></label>
        <button id="btnSave" title="Save drive 1: an MGT, or an EDSK for a disk in its own format">💾 Save disk 1</button>
        <button id="btnReset" title="Reset">⟲ Reset</button>
        <button id="btnPause" title="Pause">⏸ Pause</button>
        <button id="btnSound" title="Sound">🔇 Sound off</button>
        <button id="btnDebug" title="The debugger: registers, code, memory, breakpoints">🐞 Debugger</button>
        <span class="status" id="status"></span>
    </div>
    <div id="main">
        <div id="screen"><canvas id="canvas" tabindex="0"></canvas></div>
        <div id="debug" class="hidden"></div>
    </div>
    <div id="keys">
        Alt = SYMBOL · Ctrl = CNTRL · F1–F9 / numpad = F1–F9 · F10 / Numpad0 = F0 · Ins or ] = EDIT · End = INV ·
        Backspace = DELETE · F9 boots a disk · drop a disk on the page to boot it · click the screen for the mouse, Esc to let it go
    </div>
    <script src="lib/pako.min.js"></script>
    <script type="module">
        import { createSamApp } from './ui/sam-app.js';
        import { createSamDebugger } from './ui/sam-debug.js';
        const q = new URLSearchParams(location.search);
        const panel = document.getElementById('debug');
        let dbg = null;
        const openDebugger = () => {
            panel.classList.remove('hidden');
            if (!dbg) dbg = createSamDebugger({ root: panel, machine: window.samApp.machine, app: window.samApp });
            dbg.refresh();
        };
        window.samApp = await createSamApp({
            onBreak: (hit) => { openDebugger(); dbg.onBreak(hit); },
            onPauseChange: () => { if (dbg && !panel.classList.contains('hidden')) dbg.refresh(); },
            canvas: document.getElementById('canvas'),
            status: document.getElementById('status'),
            reset: document.getElementById('btnReset'),
            pause: document.getElementById('btnPause'),
            sound: document.getElementById('btnSound'),
            files: [document.getElementById('file1'), document.getElementById('file2')],
            save: document.getElementById('btnSave'),
            drop: document.body,
            romBase: q.get('roms') || 'roms/',
        });
        document.getElementById('btnDebug').addEventListener('click', () => {
            if (panel.classList.contains('hidden')) openDebugger(); else panel.classList.add('hidden');
        });
        if (q.get('debug') === '1') openDebugger();
    </script>
</body>
</html>
