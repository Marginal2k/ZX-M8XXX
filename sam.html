<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ZX-M8XXX SAM Coupé</title>
    <!--
      The SAM Coupé: a machine of its own, on its own page (core/sam/,
      ui/sam-app.js, ui/sam-debug.js). It shares the Z80, the SAA1099, the
      disassembler and the trigger engine with the Spectrum, and the look:
      css/app.css and the main page's layout (screen on the left, the
      debugger on the right).
    -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/dialogs.css">
    <style>
        .top-bar .sam-title { font-weight: 600; margin-right: 8px; color: var(--cyan); }
        .top-bar label.btn-like { display: inline-flex; align-items: center; cursor: pointer; }
        #screen { width: var(--zw, 640px); height: var(--zh, 480px); outline: none; }
        .sam-keys { color: var(--text-secondary); font-size: 11px; line-height: 1.5; max-width: 660px; margin-top: 6px; }
        .status #status { color: var(--cyan); }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <span class="sam-title">SAM Coupé</span>
            <label class="btn-like toolbar-select" title="Open a disk (MGT, SAD, DSK, also .gz / .zip) into drive 1 and boot it">Disk 1…<input type="file" id="file1" hidden></label>
            <label class="btn-like toolbar-select" title="Open a disk into drive 2">Disk 2…<input type="file" id="file2" hidden></label>
            <button id="btnSave" class="toolbar-select" title="Save drive 1: an MGT, or an EDSK for a disk in its own format">Save disk 1</button>
            <label class="btn-like toolbar-select" title="Open a tape (TAP, TZX, WAV, also in a .zip) and LOAD &quot;&quot; it">Tape…<input type="file" id="tapeFile" hidden></label>
            <button id="btnTapePlay" class="toolbar-select" title="Play / stop the tape (it starts and stops by itself when the ROM loads)">Play</button>
            <button id="btnTapeRewind" class="toolbar-select" title="Rewind the tape">⏮</button>
            <label class="btn-like" style="font-size:12px;gap:3px" title="Load ROM-loader blocks at once (SimCoupe's tape traps); off: in real time"><input type="checkbox" id="chkTapeFast" checked> Fast load</label>
        </div>

        <div class="main-layout">
            <div class="emulator-section">
                <div class="screen-container">
                    <div class="screen-wrapper">
                        <canvas id="screen" tabindex="0"></canvas>
                    </div>
                </div>
                <div class="status">
                    <span class="status-item"><span class="status-value" id="frames" style="min-width:48px;display:inline-block;text-align:right">0</span></span>
                    <span class="status-item"><span class="status-label">💾</span><span class="status-value" id="status">-</span></span>
                    <span class="status-item"><span class="status-label">📼</span><span class="status-value" id="tapeStatus">-</span></span>
                    <span class="status-item"><span class="status-label">MODE:</span><span class="status-value" id="modeInfo">-</span></span>
                </div>
                <div class="controls">
                    <button id="btnPause" class="primary" title="Run / Pause">Pause</button>
                    <button id="btnReset" title="Reset the machine">Reset</button>
                    <select id="zoom" title="Screen size: x1 is 320 x 240 (the screen and its border)">
                        <option value="1">x1</option><option value="2">x2</option><option value="3">x3</option>
                    </select>
                    <button id="btnSound" title="Sound on / off">🔇</button>
                </div>
                <div class="sam-keys">
                    Alt = SYMBOL · Ctrl = CNTRL · F1–F9 / numpad = F1–F9 · F10 / Numpad0 = F0 · Ins or ] = EDIT · End = INV ·
                    Backspace = DELETE · F9 boots a disk · drop a disk or a tape on the page to start it ·
                    click the screen for the mouse, Esc lets it go
                </div>
            </div>

            <div class="tab-container" id="tabContainer">
                <div class="tab-bar">
                    <button class="tab-btn active" data-tab="debug" title="The debugger (a click on the open tab hides it)"><span class="arrow">▼</span>Debug</button>
                    <button class="tab-btn" data-tab="utils" title="Explorer, GFX, OCR, Export/Import (screenshots, GIF), Mapper, Info"><span class="arrow">▶</span>Utils</button>
                </div>
                <div class="tab-content active" id="debug"></div>
                <div class="tab-content" id="utils"></div>
            </div>
        </div>
    </div>

    <script src="lib/pako.min.js"></script>
    <script type="module">
        import { createSamApp } from './ui/sam-app.js';
        import { createSamDebugger } from './ui/sam-debug.js';
        import { loadSamSymbols } from './core/sam/sam-symbols.js';
        import { createSamUtils } from './ui/sam-utils.js';
        const symbols = await loadSamSymbols('data/sam/');
        const q = new URLSearchParams(location.search);
        const panel = document.getElementById('debug'), tabs = document.getElementById('tabContainer');
        let dbg = null;
        // The tabs, as on the main page: a click opens one, a click on the open
        // one hides them all (the screen then has the page to itself)
        let utils = null, active = 'debug';
        const debuggerOn = () => !tabs.classList.contains('collapsed') && active === 'debug';
        const showTab = async (name, open = true) => {
            active = name;
            tabs.classList.toggle('collapsed', !open);
            for (const b of tabs.querySelectorAll('.tab-btn')) {
                const on = b.dataset.tab === name;
                b.classList.toggle('active', on);
                b.querySelector('.arrow').textContent = on && open ? '▼' : '▶';
            }
            panel.classList.toggle('active', name === 'debug');
            document.getElementById('utils').classList.toggle('active', name === 'utils');
            if (open && name === 'debug') {
                if (!dbg) dbg = createSamDebugger({ root: panel, machine: window.samApp.machine, app: window.samApp, symbols });
                dbg.refresh();
            }
            if (open && name === 'utils' && !utils) {
                utils = await createSamUtils({ root: document.getElementById('utils'), app: window.samApp, machine: window.samApp.machine,
                    getName: () => window.samApp.diskName?.() || 'sam',
                    getDebugger: () => dbg, symbols, say: (t) => { document.getElementById('status').textContent = t; } });
            }
            try { localStorage.setItem('zxm8-sam-tab', open ? name : '-'); } catch (e) { /* not kept */ }
        };
        const showDebugger = (on) => showTab('debug', on);
        const canvas = document.getElementById('screen');
        window.samApp = await createSamApp({
            onBreak: (hit) => { showDebugger(true); dbg.onBreak(hit); },
            onPauseChange: () => { if (dbg && debuggerOn()) dbg.refresh(); },
            labels: { run: 'Run', pause: 'Pause', soundOn: '🔊', soundOff: '🔇' },
            canvas,
            status: document.getElementById('status'),
            reset: document.getElementById('btnReset'),
            pause: document.getElementById('btnPause'),
            sound: document.getElementById('btnSound'),
            files: [document.getElementById('file1'), document.getElementById('file2')],
            save: document.getElementById('btnSave'),
            drop: document.body,
            romBase: q.get('roms') || 'roms/',
            tape: { file: document.getElementById('tapeFile'), play: document.getElementById('btnTapePlay'),
                    rewind: document.getElementById('btnTapeRewind'), fast: document.getElementById('chkTapeFast'),
                    status: document.getElementById('tapeStatus') },
        });
        tabs.querySelector('.tab-bar').addEventListener('click', (e) => {
            const b = e.target.closest('.tab-btn');
            if (!b) return;
            const open = !tabs.classList.contains('collapsed');
            showTab(b.dataset.tab, !(open && b.dataset.tab === active));
        });
        let t0 = q.get('debug') === '0' ? '-' : q.get('debug') === '1' ? 'debug' : q.get('tab');
        if (!t0) { try { t0 = localStorage.getItem('zxm8-sam-tab') || 'debug'; } catch (e) { t0 = 'debug'; } }
        await showTab(t0 === '-' ? 'debug' : t0, t0 !== '-');

        // the status line: frames, the screen mode
        const m = window.samApp.machine;
        setInterval(() => {
            document.getElementById('frames').textContent = m.frames;
            document.getElementById('modeInfo').textContent = `${((m.vmpr >> 5) & 3) + 1} · page ${m.vmpr & 0x1F}`;
        }, 250);

        // Screen size. (On the Spectrum page F1 does it; on the SAM F1 is a
        // key of its keypad, so it is a list here.)
        const zoom = document.getElementById('zoom');
        const setZoom = (z) => {
            zoom.value = z;
            canvas.style.setProperty('--zw', 320 * z + 'px');
            canvas.style.setProperty('--zh', 240 * z + 'px');
            try { localStorage.setItem('zxm8-sam-zoom', z); } catch (e) { /* not kept */ }
        };
        let z0 = q.get('zoom');
        if (!z0) { try { z0 = localStorage.getItem('zxm8-sam-zoom'); } catch (e) { /* none */ } }
        setZoom(['1', '2', '3'].includes(z0) ? z0 : '2');
        zoom.addEventListener('change', () => { setZoom(zoom.value); canvas.focus(); });
    </script>
</body>
</html>
